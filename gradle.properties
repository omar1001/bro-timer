org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 8.5.0 was tested against compileSdk 34 and warns about 35 on every build. 35 is the only
# platform installed in the borrowed toolchain, and BroMic ships the same pairing, so the warning
# is noise. Remove this line if the toolchain ever gains a newer AGP.
android.suppressUnsupportedCompileSdk=35
